{% extends 'base.html' %}
{% block content %}
<div class="card bg-white shadow-2xl p-8">
    <h2 class="text-3xl font-extrabold mb-6">Confirmar eliminación</h2>
    <p>¿Estás seguro de eliminar la transacción de ${{ object.amount_divisa }}?</p>
    <form method="post" class="mt-6">
        {% csrf_token %}
        <a href="{% url 'treasury' %}" class="btn btn-ghost">Cancelar</a>
        <button type="submit" class="btn btn-error">Eliminar</button>
    </form>
</div>
{% endblock %}
