{% extends 'base.html' %}
{% block content %}
<div class="card bg-white shadow-2xl p-8 border border-slate-100 max-w-lg mx-auto">
    <h2 class="text-3xl font-extrabold mb-6 text-slate-900">Editar Usuario</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-control w-full">
                <label class="label font-semibold text-slate-700">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <div class="flex items-center justify-end gap-3 mt-8">
            <a href="{% url 'user_list' %}" class="btn btn-ghost">Cancelar</a>
            <button type="submit" class="btn btn-primary px-8">Guardar Cambios</button>
        </div>
    </form>
</div>
{% endblock %}
